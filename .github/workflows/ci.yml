name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint and types
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: npm run build

  # The features run on three screens (phone, tablet, desktop) and grow with every story: each
  # screen has its own job, the three at once, so a story more does not add to the others' time.
  # A job cut off at its time limit is not deployed (the deploy waits for every check).
  e2e-screen:
    name: Acceptance tests (${{ matrix.screen }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        screen: [phone, tablet, desktop]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The screen this job runs the features and the layout checks on (e2e/playwright.config.ts).
      E2E_SCREEN: ${{ matrix.screen }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Starts the API and the web dev server, then runs the Gherkin features.
      - name: Gherkin features
        run: npm run e2e
      - name: Attach the report to the run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.screen }}
          path: e2e/playwright-report/
          if-no-files-found: ignore

  # One check for the acceptance tests whatever the screens: it passes only when every screen did.
  e2e:
    name: Acceptance tests
    needs: e2e-screen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every screen passed
        run: test "${{ needs.e2e-screen.result }}" = success

  mutation:
    name: Mutation testing (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [packages/domain, packages/contracts, apps/api, tools/guide-check]
    env:
      # Each job keeps its own incremental report.
      REPORT_KEY: stryker-${{ matrix.workspace }}
    steps: &mutation-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A report keeps the results of files it no longer mutates, so a change of the Stryker
      # settings (such as the files of a part) starts from an empty one.
      - name: Name the mutation report after the Stryker settings
        id: report
        run: echo "prefix=$REPORT_KEY-${{ hashFiles('stryker.base.mjs', format('{0}/stryker.config.mjs', matrix.workspace)) }}" >> "$GITHUB_OUTPUT"
      # Incremental runs: start from this branch's last report, or from main's.
      - name: Restore the last mutation report
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.workspace }}/reports/stryker-incremental*.json
          key: ${{ steps.report.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.report.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-
            ${{ steps.report.outputs.prefix }}-main-
      - name: Mutation tests (fail below the threshold)
        run: npm run mutation
        working-directory: ${{ matrix.workspace }}
      - name: Save the mutation report for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.workspace }}/reports/stryker-incremental*.json
          key: ${{ steps.report.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
      - name: Attach the report to the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ matrix.workspace }}/reports/mutation/
          if-no-files-found: ignore

  # Two thirds of the date reader's mutants are in one file, and all of them run again when its
  # grammar changes, so it runs in three parallel parts, each held to the threshold on its own;
  # `packages/date-reader/stryker.config.mjs` says what each takes.
  mutation-date-reader-part:
    name: Mutation testing (packages/date-reader, part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [packages/date-reader]
        part: [1, 2, 3]
    env:
      STRYKER_PART: ${{ matrix.part }}
      REPORT_KEY: stryker-packages/date-reader-part-${{ matrix.part }}
    steps: *mutation-steps

  # One check for the date reader whatever the number of parts: it passes only when every part
  # did.
  mutation-date-reader:
    name: Mutation testing (packages/date-reader)
    needs: mutation-date-reader-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part reached the threshold
        run: test "${{ needs.mutation-date-reader-part.result }}" = success

  # The web has the most mutants and the slowest tests, so it runs in nine parallel parts, each
  # held to the threshold on its own; `apps/web/stryker.config.mjs` says which files each takes
  # and refuses to run when the parts listed here are not as many as its own.
  mutation-web-part:
    name: Mutation testing (apps/web, part ${{ matrix.part }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [apps/web]
        part: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      STRYKER_PART: ${{ matrix.part }}
      STRYKER_PARTS: ${{ strategy.job-total }}
      REPORT_KEY: stryker-apps/web-part-${{ matrix.part }}
    steps: *mutation-steps

  # One check for the web whatever the number of parts: it passes only when every part did.
  mutation-web:
    name: Mutation testing (apps/web)
    needs: mutation-web-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part reached the threshold
        run: test "${{ needs.mutation-web-part.result }}" = success

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint and types
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: npm run build

  e2e:
    name: Acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Starts the API and the web dev server, then runs the Gherkin features.
      - name: Gherkin features
        run: npm run e2e
      - name: Attach the report to the run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  mutation:
    name: Mutation testing (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [packages/domain, packages/contracts, apps/api, tools/guide-check]
    env:
      # Each job keeps its own incremental report.
      REPORT_KEY: stryker-${{ matrix.workspace }}
    steps: &mutation-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A report keeps the results of files it no longer mutates, so a change of the Stryker
      # settings (such as the files of a part) starts from an empty one.
      - name: Name the mutation report after the Stryker settings
        id: report
        run: echo "prefix=$REPORT_KEY-${{ hashFiles('stryker.base.mjs', format('{0}/stryker.config.mjs', matrix.workspace)) }}" >> "$GITHUB_OUTPUT"
      # Incremental runs: start from this branch's last report, or from main's.
      - name: Restore the last mutation report
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.workspace }}/reports/stryker-incremental*.json
          key: ${{ steps.report.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.report.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-
            ${{ steps.report.outputs.prefix }}-main-
      - name: Mutation tests (fail below the threshold)
        run: npm run mutation
        working-directory: ${{ matrix.workspace }}
      - name: Save the mutation report for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.workspace }}/reports/stryker-incremental*.json
          key: ${{ steps.report.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
      - name: Attach the report to the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ matrix.workspace }}/reports/mutation/
          if-no-files-found: ignore

  # The web has the most mutants and the slowest tests, so it runs in four parallel parts, each
  # held to the threshold on its own; `apps/web/stryker.config.mjs` says which files each takes.
  mutation-web-part:
    name: Mutation testing (apps/web, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [apps/web]
        part: [1, 2, 3, 4]
    env:
      STRYKER_PART: ${{ matrix.part }}
      REPORT_KEY: stryker-apps/web-part-${{ matrix.part }}
    steps: *mutation-steps

  # One check for the web whatever the number of parts: it passes only when every part did.
  mutation-web:
    name: Mutation testing (apps/web)
    needs: mutation-web-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part reached the threshold
        run: test "${{ needs.mutation-web-part.result }}" = success

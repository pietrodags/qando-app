name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint and types
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: npm run build

  e2e:
    name: Acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Starts the API and the web dev server, then runs the Gherkin features.
      - name: Gherkin features
        run: npm run e2e
      - name: Attach the report to the run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  mutation:
    name: Mutation testing (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [packages/domain, packages/contracts, apps/api, apps/web, tools/guide-check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Incremental runs: start from this branch's last report, or from main's.
      - name: Restore the last mutation report
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.workspace }}/reports/stryker-incremental.json
          key: stryker-${{ matrix.workspace }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.workspace }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ matrix.workspace }}-main-
      - name: Mutation tests (fail below the threshold)
        run: npm run mutation
        working-directory: ${{ matrix.workspace }}
      - name: Save the mutation report for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.workspace }}/reports/stryker-incremental.json
          key: stryker-${{ matrix.workspace }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
      - name: Attach the report to the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: ${{ matrix.workspace }}/reports/mutation/
          if-no-files-found: ignore

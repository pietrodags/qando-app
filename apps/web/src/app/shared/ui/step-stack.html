<!-- Tracked by the step: a step keeps its element while it moves between tab, card and leaving. -->
@for (view of shown(); track view.step) {
  <section
    #step
    class="step"
    [class.folded]="view.folded"
    [class.card]="view.place === 'card'"
    [class.leaving]="view.place === 'leaving'"
    [class.returning]="view.returning"
    [style.--tab-depth]="view.depth"
    [attr.tabindex]="view.place === 'card' ? -1 : null"
    [attr.aria-label]="view.place === 'card' ? view.step.appStep() : null"
    [attr.inert]="view.place === 'leaving' ? '' : null"
    animate.enter="entering"
  >
    @if (view.place === 'tab') {
      <button class="tab" type="button" [disabled]="locked()" (click)="current.set(view.n)">
        {{ view.step.appStep() }}
      </button>
    } @else {
      <p class="step-label" [style.--step-accent]="'var(--q-accent-' + view.step.accent() + ')'">
        {{ view.step.appStep() }}
      </p>
    }
    <!-- What a step holds folds away with it; only the card's can be used. -->
    <div class="body" [attr.inert]="view.place === 'card' ? null : ''">
      <div class="content">
        @if (view.content) {
          <ng-container [ngTemplateOutlet]="view.step.template" />
        }
      </div>
    </div>
  </section>
}

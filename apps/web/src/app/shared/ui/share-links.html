<button class="share" type="button" (click)="share()">
  <!-- Heroicons outline: share -->
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"
    />
  </svg>
  {{ 'common.share.button' | transloco }}
</button>

    class="channel brand"
    [href]="telegram()"
    target="_blank"
    rel="noopener"
    [title]="'common.share.telegram' | transloco"
    [attr.aria-label]="'common.share.telegram' | transloco"
  >
    <!-- Simple Icons: Telegram -->
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path

    </svg>

  <a
    class="channel"
    [href]="email()"
    [title]="'common.share.email' | transloco"
    [attr.aria-label]="'common.share.email' | transloco"
  >
    <!-- Heroicons solid: envelope -->
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"
      />
      <path
        d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z"
      />
    </svg>
  </a>
  <button
    class="channel"
    type="button"
    [title]="'common.share.copyLink' | transloco"
    [attr.aria-label]="'common.share.copyLink' | transloco"
    (click)="copy()"
  >
    <!-- Heroicons outline: link -->
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"
      />
    </svg>
  </button>
</div>

<button
  #toggle
  class="account"
  type="button"
  aria-controls="account-menu"
  [attr.aria-label]="'shell.account' | transloco: { who: who() }"
  [attr.aria-expanded]="open()"
  (click)="open.set(!open())"
>
  <span class="initial" aria-hidden="true">
    <!-- The circle of the "Entrar" icon's line. -->
    <svg class="ring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="11.25" />
    </svg>
    <span class="letter">{{ initial() }}</span>
  </span>
</button>
@if (open()) {
  <div class="menu" id="account-menu">
    <div class="email-row">
      <p class="email">{{ account().email }}</p>
      <button
        #trash
        appHoverTip
        #tip="appHoverTip"
        class="trash"
        type="button"
        [attr.aria-label]="'shell.deleteAccount' | transloco"
        (click)="askDeletion()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <!-- Heroicons outline: trash -->
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
          />
        </svg>
      </button>
    </div>
    @if (tip.shown()) {
      <!-- Under the trash: above, it would cover the button the menu hangs from. -->
      <app-tooltip [anchor]="trash" placement="below" aria-hidden="true">{{
        'shell.deleteAccount' | transloco
      }}</app-tooltip>
    }
    <ul class="items">
      <li>
        <a class="item" routerLink="/my-events" (click)="open.set(false)">{{
          'shell.myEvents' | transloco
        }}</a>
      </li>
      <li>
        <a class="item" routerLink="/connected-apps" (click)="open.set(false)">{{
          'shell.connectedApps' | transloco
        }}</a>
      </li>
      <li>
        <a class="item" routerLink="/privacy" (click)="open.set(false)">{{
          'shell.privacy' | transloco
        }}</a>
      </li>
      <li class="apart">
        <button class="item" type="button" (click)="signOut()">
          {{ 'shell.signOut' | transloco }}
        </button>
      </li>
    </ul>
  </div>
}
<!-- Rarely opened: its code loads apart from the app's first, once the page is idle. -->
@defer (when deleting(); prefetch on idle) {
  @if (deleting()) {
    <app-account-deletion [email]="account().email" (closed)="deleting.set(false)" />
  }
}

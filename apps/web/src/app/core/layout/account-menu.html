<button
  #toggle
  class="account"
  type="button"
  aria-controls="account-menu"
  [attr.aria-label]="'shell.account' | transloco: { who: who() }"
  [attr.aria-expanded]="open()"
  (click)="open.set(!open())"
>
  <span class="initial" aria-hidden="true">
    <!-- The circle of the "Entrar" icon's line. -->
    <svg class="ring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="11.25" />
    </svg>
    <span class="letter">{{ initial() }}</span>
  </span>
</button>
@if (open()) {
  <div class="menu" id="account-menu">
    <p class="email">{{ account().email }}</p>
    <ul class="items">
      <li>
        <a class="item" routerLink="/my-events" (click)="open.set(false)">{{
          'shell.myEvents' | transloco
        }}</a>
      </li>
      <li class="apart">
        <button class="item" type="button" (click)="signOut()">
          {{ 'shell.signOut' | transloco }}
        </button>
      </li>
    </ul>
  </div>
}

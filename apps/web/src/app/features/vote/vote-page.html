<main class="page">
  @if (notFound()) {
    <app-not-found-card />
  } @else if (ended(); as ended) {
    <app-vote-ended [ended]="ended" />
  } @else if (ready() && event.hasValue() && event.value().state === 'open') {
    @if (editLink(); as link) {
      <app-vote-thanks
        [organizerName]="event.value().organizerName"
        [deadline]="event.value().deadline"
        [editLink]="link"
        [updated]="updated()"
      />
    } @else {
      <!-- While the vote is on its way the steps stay put: answers changed then would not be sent. -->
      <app-step-stack [(current)]="step" [locked]="sending()">
        <ng-template [appStep]="'vote.step' | transloco: { step: 1 }">
          <app-vote-welcome
            [event]="event.value()"
            [(name)]="name"
            [sending]="sending()"
            [quickVoteFailed]="failed() === 'quick'"
            [notice]="notice()"
            (choose)="step.set(2)"
            (quickVote)="sendQuickVote()"
          />
        </ng-template>
        <!-- The last step takes its colour: the days, or the times when the event has them. -->
        <ng-template
          [appStep]="'vote.step' | transloco: { step: 2 }"
          [accent]="hasTimes() ? 'slate' : 'amber'"
        >
          <!-- Covered by the confirmation: out of reach of the keyboard and screen readers. -->
          <app-vote-days
            [inert]="confirming()"
            [options]="event.value().options"
            [(answers)]="answers"
            (back)="step.set(1)"
            (toTimes)="step.set(3)"
            (done)="confirming.set(true)"
          />
          @if (confirming()) {
            <ng-container [ngTemplateOutlet]="confirmation" />
          }
        </ng-template>
        @if (hasTimes()) {
          <ng-template [appStep]="'vote.step' | transloco: { step: 3 }" accent="amber">
            <app-vote-times
              [inert]="confirming()"
              [options]="event.value().options"
              [timeZone]="event.value().timeZone"
              [(answers)]="answers"
              (back)="step.set(2)"
              (done)="confirming.set(true)"
            />
            @if (confirming()) {
              <ng-container [ngTemplateOutlet]="confirmation" />
            }
          </ng-template>
        }
      </app-step-stack>
      <ng-template #confirmation>
        <app-vote-confirm
          [answers]="answers()"
          [deadline]="event.value().deadline"
          [sending]="sending()"
          [failed]="failed() === 'confirmed'"
          (back)="confirming.set(false)"
          (send)="sendAnswers()"
        />
      </ng-template>
    }
  } @else if (event.error()) {
    <!-- The API could not be reached or failed: reading the event again may work. -->
    <app-error-state (retry)="event.reload()" />
  } @else {
    <app-loading-state />
  }
</main>

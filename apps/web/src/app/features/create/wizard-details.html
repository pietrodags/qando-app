<!-- A form so that Enter in the field presses the arrow; the browser checks nothing itself. -->
<form class="details" [formRoot]="fields">
  <label class="question" for="event-title">{{ 'create.details.titleLabel' | transloco }}</label>
  <input
    #titleField
    id="event-title"
    class="field"
    type="text"
    autocomplete="off"
    [formField]="fields.title"
    [appCharacterLimit]="titleMax"
  />

  <div class="nav">
    <!-- For screen readers only: on screen, the question above the field says what to write. -->
    @if (missing(); as missing) {
      <span id="details-missing" class="visually-hidden">{{ missing }}</span>
    }
    <!-- aria-disabled, not disabled: the arrow stays in the Tab order and is heard with why. -->
    <button
      type="submit"
      class="nav-button"
      [attr.aria-label]="'create.details.next' | transloco"
      [attr.aria-disabled]="missing() !== ''"
      [attr.aria-describedby]="missing() ? 'details-missing' : null"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <!-- Heroicons outline: arrow-right -->
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
        />
      </svg>
    </button>
  </div>
</form>

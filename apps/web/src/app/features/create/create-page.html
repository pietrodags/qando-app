<main class="page">
  @if (created(); as event) {
    <app-create-done [event]="event" (again)="startAgain()" />
  } @else {
    <app-step-stack [(current)]="step" [locked]="locked()">
      <ng-template [appStep]="'create.step' | transloco: { step: 1 }" accent="blue">
        <app-wizard-details [(details)]="details" (next)="step.set(2)" />
      </ng-template>
      <ng-template [appStep]="'create.step' | transloco: { step: 2 }" accent="teal">
        <app-wizard-dates
          [(selection)]="dates"
          [(month)]="month"
          [(phrase)]="phrase"
          (back)="step.set(1)"
          (next)="step.set(3)"
        />
      </ng-template>
      @if (timesAsked()) {
        <!-- The times, then their summary in their place, on the same columns. -->
        <ng-template [appStep]="'create.step' | transloco: { step: 3 }" accent="amber">
          @if (summary()) {
            <app-wizard-summary
              [(selection)]="dates"
              [(place)]="place"
              (back)="showSummary(false)"
              (next)="step.set(4)"
            />
          } @else {
            <app-wizard-times
              [(selection)]="dates"
              [(place)]="place"
              (back)="step.set(2)"
              (next)="showSummary(true)"
            />
          }
        </ng-template>
      }
      <!-- Named "último paso", not by its number: nothing is asked after it. -->
      <ng-template [appStep]="'create.lastStep' | transloco" accent="salmon">
        <app-wizard-finish
          [details]="details()"
          [selection]="dates()"
          [step]="lastStep()"
          [(ending)]="ending"
          [(sent)]="sent"
          [(code)]="code"
          (back)="step.set(lastStep() - 1)"
          (sending)="sending.set($event)"
          (created)="created.set($event)"
        />
      </ng-template>
    </app-step-stack>
  }
</main>

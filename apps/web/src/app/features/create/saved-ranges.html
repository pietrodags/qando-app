<ul class="pills">
  @for (range of ranges(); track range) {
    <li
      class="pill"
      [class.pinned]="range === pinned()"
      (pointerenter)="over($event, range)"
      (pointerleave)="previewed.emit(null)"
    >
      <button
        #pillButton
        type="button"
        class="pill-view"
        [attr.aria-pressed]="range === pinned()"
        (click)="pin(range)"
      >
        {{ words.shortDay(range.start) }}
        <span class="to" aria-hidden="true">➔</span>
        <!-- What screen readers hear in place of the arrow: "Lun 22 a Vie 26". -->
        <span class="visually-hidden">{{ 'create.dates.rangeTo' | transloco }}</span>
        {{ words.shortDay(range.end) }}
      </button>
      <!-- A mouse and the keyboard find it on the pill while none is pinned; without a mouse it is
           there only on the pinned pill, never to be pressed unseen. -->
      @if (touch() ? range === pinned() : pinned() === null) {
        <button
          type="button"
          class="remove"
          [title]="'create.dates.remove' | transloco"
          [attr.aria-label]="
            'create.dates.removeRange'
              | transloco
                : { start: words.dayOfMonth(range.start), end: words.dayOfMonth(range.end) }
          "
          (click)="remove(range)"
        >
          −
        </button>
      }
    </li>
  }
</ul>

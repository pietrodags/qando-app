<!-- Reached, today is read again: a select opened after midnight no longer offers yesterday. -->
<div class="selects" role="group" [attr.aria-labelledby]="labelledBy()" (focusin)="rereadToday()">
  <span class="select day">
    <select
      #daySelect
      [attr.aria-label]="'create.finish.deadlineDay' | transloco"
      (change)="choose('day', daySelect.value)"
    >
      @for (day of days(); track day) {
        <option [value]="day" [selected]="day === chosen().day">{{ day }}</option>
      }
    </select>
    <ng-container *ngTemplateOutlet="chevron" />
  </span>
  <span class="select month">
    <select
      #monthSelect
      [attr.aria-label]="'create.finish.deadlineMonth' | transloco"
      (change)="choose('month', monthSelect.value)"
    >
      @for (month of months(); track month.month) {
        <option [value]="month.month" [selected]="month.month === chosen().month">
          {{ month.name }}
        </option>
      }
    </select>
    <ng-container *ngTemplateOutlet="chevron" />
  </span>
  <span class="select year">
    <select
      #yearSelect
      [attr.aria-label]="'create.finish.deadlineYear' | transloco"
      (change)="choose('year', yearSelect.value)"
    >
      @for (year of years(); track year) {
        <option [value]="year" [selected]="year === chosen().year">{{ year }}</option>
      }
    </select>
    <ng-container *ngTemplateOutlet="chevron" />
  </span>
</div>

<ng-template #chevron>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <!-- Heroicons outline: chevron-down -->
    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
  </svg>
</ng-template>

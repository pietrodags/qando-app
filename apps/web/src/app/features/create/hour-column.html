<!--
  ︿ ﹀ are for the mouse and the finger; the keyboard reaches each hour, and the list follows.
  Greyed with a class, never disabled: a button disabled while it is held may not hear the pointer
  lift, and would go on repeating.
-->
<button
  type="button"
  class="fold"
  aria-hidden="true"
  tabindex="-1"
  [class.spent]="scroller.atStart()"
  (appHoldRepeat)="scroller.back()"
>
  ︿
</button>
<div
  class="hours"
  [class.empty]="empty()"
  [appScrollFold]="shown"
  [foldHeight]="room()"
  [foldLeast]="least"
  [foldStart]="opening"
  #scroller="appScrollFold"
  appRowDrag
  #rowDrag="appRowDrag"
  (dragging)="dragged($event)"
  (dropped)="make($event)"
  (scroll)="tipLost.set(true)"
>
  @for (row of rows(); track row.hour) {
    <!-- The hour and its minutes are laid out as two boxes, which a browser names "9 :00": the
         button says its name itself, and an hour of a range adds its range. -->
    <div class="row" [class]="row.classes" appLongPress (longPress)="rowDrag.rested(row.hour)">
      <button
        type="button"
        class="time"
        #time
        [attr.aria-label]="
          row.range
            ? ('create.times.inRange'
              | transloco: { time: row.label, start: row.range.start, end: row.range.end })
            : row.label
        "
        [attr.aria-pressed]="row.marked"
        [tabindex]="row.hour === tabStop() ? 0 : -1"
        (click)="press(row.hour)"
        (focus)="tabStop.set(row.hour)"
        (keydown.arrowUp)="$event.preventDefault(); focus(row.hour - 1)"
        (keydown.arrowDown)="$event.preventDefault(); focus(row.hour + 1)"
        (keydown.arrowLeft)="$event.preventDefault(); move(row.hour, -1)"
        (keydown.arrowRight)="$event.preventDefault(); move(row.hour, 1)"
        (keydown.shift.enter)="$event.preventDefault(); hold(row.hour)"
        (keydown.escape)="held.set(null)"
      >
        {{ row.hour }}<small>{{ row.minutes }}</small>
      </button>
      @if (row.moves) {
        <!-- aria-disabled, not disabled: an arrow keeps the focus when its time reaches the stop. -->
        <button
          type="button"
          class="quarter earlier"
          tabindex="-1"
          [attr.aria-label]="'create.times.earlier' | transloco: { time: row.label }"
          [attr.aria-disabled]="row.atFirstQuarter"
          (click)="move(row.hour, -1)"
        >
          ‹
        </button>
        <button
          type="button"
          class="quarter later"
          tabindex="-1"
          [attr.aria-label]="'create.times.later' | transloco: { time: row.label }"
          [attr.aria-disabled]="row.atLastQuarter"
          (click)="move(row.hour, 1)"
        >
          ›
        </button>
      }
    </div>
  }
</div>
<button
  type="button"
  class="fold"
  aria-hidden="true"
  tabindex="-1"
  [class.spent]="scroller.atEnd()"
  (appHoldRepeat)="scroller.forward()"
>
  ﹀
</button>
<!-- For the eyes of who makes a range with the keyboard: screen readers hear the text below. -->
@if (tipHour(); as hour) {
  <app-tooltip aria-hidden="true" [anchor]="hour">{{
    'create.times.rangeEnd' | transloco
  }}</app-tooltip>
}
@if (ring(); as box) {
  <i
    class="ring"
    appTopLayer
    aria-hidden="true"
    [style.--hold-duration]="holdDuration"
    [style.inset-block-start.px]="box.top"
    [style.inset-inline-start.px]="box.left"
    [style.inline-size.px]="box.width"
    [style.block-size.px]="box.height"
  ></i>
}
<!-- Always in the page, so that screen readers hear its text when it comes. -->
<p class="visually-hidden" role="status">
  @if (held() !== null) {
    {{ 'create.times.rangeEnd' | transloco }}
  }
</p>

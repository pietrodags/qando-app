<app-code-step
  #step
  checkingKey="signIn.code.checking"
  [email]="email()"
  [resendAfterSeconds]="resendAfterSeconds()"
  [actions]="actions"
  [headingLevel]="purpose() === 'create' ? 2 : 1"
  [hintKey]="purpose() === 'create' ? 'signIn.code.createHint' : 'signIn.code.hint'"
>
  <p>
    {{ 'signIn.code.wrongEmail' | transloco }}
    <!-- Not while a code is checked: its answer may sign in, and this step must hear it. -->
    <button class="link" type="button" [disabled]="step.checking()" (click)="changeEmail.emit()">
      {{ 'signIn.code.changeEmail' | transloco }}
    </button>
  </p>
</app-code-step>

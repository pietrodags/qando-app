# Render Blueprint: static web on Render's CDN, API and PostgreSQL in Frankfurt (EU).
# Changes to this file are applied by Render when it syncs the Blueprint from main.
services:
  - type: web
    name: qando-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    # The API runs the compiled domain and contracts packages, so they are built first.
    buildCommand: npm ci && npm run build --workspace @qando/domain --workspace @qando/contracts --workspace @qando/api
    # Applies pending migrations before the new version starts; a failure stops the deploy.
    preDeployCommand: node apps/api/dist/migrate.js
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qando-db
          property: connectionString
      # Signs the session cookies: generated once by Render, kept on every deploy.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The public address of the pages (the web forwards /api here): sessions are trusted from it.
      - key: BETTER_AUTH_URL
        value: https://qando.app
      # Sign-in codes go out through Scaleway Transactional Email over SMTP with STARTTLS.
      - key: SMTP_HOST
        value: smtp.tem.scaleway.com
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM
        value: qando <no-reply@qando.app>
      # The Scaleway project ID and an API secret key of its own: set by hand in Render, never here.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: qando-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @qando/web
    staticPublishPath: apps/web/dist/web/browser
    autoDeployTrigger: checksPass
    # Render adds www.qando.app too and redirects it to the root domain.
    domains:
      - qando.app
    routes:
      # The web calls the API on its own origin: no CORS, one public URL.
      - type: rewrite
        source: /api/*
        destination: https://qando-api.onrender.com/api/*
      # Client-side routes are served by the Angular app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

databases:
  - name: qando-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: '18'
